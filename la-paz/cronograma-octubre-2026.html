<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma La Paz · Octubre</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --card:#141414; --line:#2A2A2A; --white:#FFFFFF; --muted:#8C8C8C; --gold:#DBAD30;
    --reel:#DBAD30; --carrusel:#9B6BE0; --post:#E5534B; --historia:#3FD96B;
    --f:'Inter Tight', system-ui, sans-serif;
  }
  @page{ size:A4 landscape; margin:0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--white); font-family:var(--f);
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .page{ width:297mm; height:210mm; padding:11mm 13mm 9mm; display:flex; flex-direction:column; }

  header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:5mm; }
  .brand{ font-size:8.5pt; font-weight:800; letter-spacing:.32em; color:var(--gold); margin-bottom:2mm; }
  h1{ font-size:24pt; font-weight:800; letter-spacing:-.02em; line-height:1; }
  h1 span{ color:var(--gold); }
  .legend{ display:flex; gap:4.5mm; font-size:8.5pt; color:#d0d0d0; align-items:center; }
  .legend i{ width:3mm; height:3mm; border-radius:50%; display:inline-block; margin-right:1.5mm; vertical-align:-.4mm; }
  .chip{ font-size:6.5pt; font-weight:800; letter-spacing:.1em; padding:.4mm 1.5mm; border-radius:1mm; }
  .chip.pauta{ border:1px solid var(--gold); color:var(--gold); }
  .chip.ok{ background:#2a2a2a; color:#bdbdbd; }

  .cal{ flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:auto repeat(5,minmax(0,1fr)); gap:1.6mm; min-height:0; }
  .dow{ font-size:8pt; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding:0 2mm 1mm; }
  .day{ background:var(--card); border:1px solid var(--line); border-radius:2mm; padding:2mm 2.2mm;
    display:flex; flex-direction:column; gap:1.4mm; min-height:0; }
  .day.out{ background:transparent; border:1px dashed #1f1f1f; }
  .day.out .n{ color:#333; }
  .day.today{ border:1.6px solid var(--gold); }
  .day.done .piece{ opacity:.5; }
  .top{ display:flex; justify-content:space-between; align-items:center; }
  .n{ font-size:13pt; font-weight:800; }
  .tag{ font-size:6.3pt; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  .piece{ border-left:2.6px solid var(--c); padding:.6mm 0 .6mm 2mm; }
  .piece .t{ font-size:6.4pt; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--c); }
  .piece .x{ font-size:8pt; line-height:1.2; margin-top:.4mm; }
  .status{ margin-top:auto; display:flex; gap:1.2mm; flex-wrap:wrap; }
</style>
</head>
<body>
<section class="page">
  <header>
    <div>
      <div class="brand">QUIROZ AGENCIA</div>
      <h1>Cristalería La Paz · <span>Octubre 2026</span></h1>
    </div>
    <div class="legend">
      <span><i style="background:var(--reel)"></i>Reel</span>
      <span><i style="background:var(--carrusel)"></i>Carrusel</span>
      <span><i style="background:var(--post)"></i>Post</span>
      <span><i style="background:var(--historia)"></i>Historia</span>
      <span class="chip pauta">PAUTA</span>
      <span class="chip ok">✓ PUBLICADO</span>
    </div>
  </header>
  <div class="cal" id="cal"></div>
</section>

<script>
  // [tipo, título, pauta]
  const P = {
    1:[["reel","Cuatro formas de vivir el café",1]],
    2:[["historia","Encuesta · ¿Cómo tomas el café?"]],
    3:[["carrusel","6 cosas que no sabías que encontrabas en La Paz",1]],
    7:[["reel","En La Paz encuentras todo para tu hogar",1]],
    8:[["historia","Más de lo que imaginas (mascota)"]],
    9:[["post","No todos los recipientes funcionan igual"]],
    10:[["carrusel","5 productos que no sabías que necesitabas en tu cocina",1]],
    11:[["historia","Soluciones para tu cocina (sartén)"]],
    12:[["post","Una copa no es solo una copa"]],
    13:[["reel","3 productos que vas a querer en casa",1]],
    14:[["historia","Organiza tu día (Polimes)"]],
    15:[["carrusel","Alimentarte mejor también es organizarte",1]],
    16:[["reel","Claudia Dávila · ¿Te estás alimentando bien?"]],
    17:[["historia","Caja de preguntas con Claudia"]],
    20:[["post","Feliz Día Internacional del Chef"]],
    21:[["historia","Día del Chef · línea profesional"]],
    22:[["reel","Productos para cada espacio de tu hogar"]],
    23:[["historia","Descubre algo nuevo (horno 5 en 1)"]],
    25:[["historia","Día Mundial de la Pasta"]],
    29:[["reel","Takashi descubre la sección de mascotas"]],
  };
  const DONE = [1,2,3];
  const TAG = {7:"Hoy",15:"Día alimentación",16:"Día alimentación",20:"Día del chef",25:"Día de la pasta"};
  const NAME = {reel:"Reel",carrusel:"Carrusel",post:"Post",historia:"Historia"};

  const cal = document.getElementById("cal");
  ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"].forEach(d=>cal.insertAdjacentHTML("beforeend",`<div class="dow">${d}</div>`));
  const cells=[28,29,30].map(n=>({n,out:1}));
  for(let d=1; d<=31; d++) cells.push({n:d});
  cells.push({n:1,out:1});
  cells.forEach(({n,out})=>{
    if(out){ cal.insertAdjacentHTML("beforeend",`<div class="day out"><div class="n">${n}</div></div>`); return; }
    const done = DONE.includes(n);
    let cls = "day" + (done?" done":"") + (n===7?" today":"");
    let h = `<div class="${cls}"><div class="top"><span class="n">${n}</span><span class="tag">${TAG[n]||""}</span></div>`;
    const items = P[n]||[];
    items.forEach(([t,x])=>{ h+=`<div class="piece" style="--c:var(--${t})"><div class="t">${NAME[t]}</div><div class="x">${x}</div></div>`; });
    const st=[];
    if(!done && items.some(i=>i[2])) st.push(`<span class="chip pauta">PAUTA</span>`);
    if(done) st.push(`<span class="chip ok">✓ PUBLICADO</span>`);
    if(st.length) h+=`<div class="status">${st.join("")}</div>`;
    h+=`</div>`;
    cal.insertAdjacentHTML("beforeend",h);
  });
</script>
</body>
</html>
